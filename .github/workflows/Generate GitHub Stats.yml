name: Generate GitHub Stats

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate light stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=f9f9f9&title_color=0b7285&text_color=333333&icon_color=0b7285&border_color=e4e4e4&hide_border=false
          path: dist/github-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&title_color=0b7285&text_color=ffffff&icon_color=0b7285&border_color=e4e4e4&hide_border=false
          path: dist/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&bg_color=f9f9f9&title_color=0b7285&text_color=333333&icon_color=0b7285&border_color=e4e4e4&hide_border=false
          path: dist/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark&title_color=0b7285&text_color=ffffff&icon_color=0b7285&border_color=e4e4e4&hide_border=false
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
